# TextSplit Processor Configuration

# 处理模式: "single" - 单文件模式, "directory" - 目录模式
mode: "directory"

# 文件路径 (单文件模式使用)
input_path: "/mnt/c/Users/ThinkPad/my_own_files/work/projects/shujupingtai/multi-language/nemotron/test_data"
output_path: "/mnt/c/Users/ThinkPad/my_own_files/work/projects/shujupingtai/multi-language/nemotron/test_data_output"

# 文本拆分器类型: "token" - TokenTextSplitter, "semantic" - SemanticTextSplitter, "tokenizer" - HuggingFaceTokenizerSplitter, "pysbd" - PySBDSplitter
splitter_type: "pysbd"

# 要处理的content字段名
content_field: "content"

# TokenTextSplitter参数
token_splitter:
  max_tokens: 1000
  overlap: 100

# SemanticTextSplitter参数 (LangChain 0.3.x版本)
semantic_splitter:
  chunk_size: 1000
  buffer_size: 1
  add_start_index: false

# HuggingFaceTokenizerSplitter参数 (使用HuggingFace tokenizer进行精确token统计和切分)
tokenizer_splitter:
  max_tokens: 1000
  overlap: 100
  hf_model_name: "bert-base-uncased"
  language: "zh"

# PySBDSplitter参数 (使用pysbd进行精确句子分割)
pysbd_splitter:
  max_tokens: 1000
  overlap: 100
  language: "zh"
  language_is_code: true

# Celery配置
celery:
  broker: "redis://localhost:6379/0"
  backend: "redis://localhost:6379/1"

# 日志配置
logging:
  level: "INFO"